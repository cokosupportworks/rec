<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>音ノ姫 -Oto no Hime-</title>

    <link rel="apple-touch-icon" href="./apple-touch-icon.png">
    <link rel="icon" href="apple-touch-icon.png">

    <!-- Google Fonts: 雅な和風フォントと読みやすいゴシック -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hina+Mincho&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- lamejs for MP3 encoding -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
    
    <style>
        :root {
            /* 透き通る海と白い砂浜、江戸の金 */
            --sea-clear-light: #90e0ef;
            --sea-clear-mid: #00b4d8;
            --sea-deep: #0077b6;
            --sand-white: #fdfbf7;
            --gold-light: #f9df9f;
            --gold-main: #d4af37;
            --gold-dark: #aa8222;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, var(--sea-clear-mid) 0%, var(--sea-clear-light) 40%, var(--sand-white) 100%);
            color: var(--sea-deep);
            overscroll-behavior: none;
            touch-action: none; /* ページ全体のデフォルトのパンやズームを無効化（ドラッグ時のスクロール防止） */
            min-height: 100vh;
        }
        
        .font-hime {
            font-family: 'Hina Mincho', serif;
        }

        /* 磨りガラス風の明るい半透明パネル */
        .edo-panel {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px rgba(0, 119, 182, 0.15), inset 0 0 10px rgba(212, 175, 55, 0.1);
            border-radius: 12px;
        }

        /* 金装飾ボタン */
        .btn-gold {
            background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold-main) 50%, var(--gold-light) 100%);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.8);
            text-shadow: 0 1px 2px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3);
        }
        .btn-gold:hover:not(:disabled) {
            filter: brightness(1.1);
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(212, 175, 55, 0.5);
        }
        .btn-gold:disabled {
            background: rgba(255, 255, 255, 0.5);
            color: #888;
            border-color: rgba(0, 0, 0, 0.1);
            box-shadow: none;
            text-shadow: none;
        }

        .meter-container {
            height: 14px;
            background-color: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(0, 180, 216, 0.3);
            border-radius: 7px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
        }

        #volume-meter-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        
        /* 波形エディタ */
        .waveform-container {
            position: relative;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(0, 180, 216, 0.4);
            border-radius: 8px;
            overflow-x: auto;
            touch-action: pan-x; /* 波形の横スクロールのみ許可 */
            box-shadow: inset 0 0 15px rgba(0, 119, 182, 0.05);
        }
        
        #waveform-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* 金のトリミングハンドル */
        .trim-handle {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 24px;
            background-color: rgba(255, 255, 255, 0.6);
            border: 2px solid var(--gold-main);
            cursor: ew-resize;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: translateX(-50%);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
            backdrop-filter: blur(4px);
        }
        
        .trim-handle::after {
            content: '';
            width: 2px;
            height: 50px;
            background-color: var(--gold-dark);
            border-radius: 1px;
        }

        #trim-start { left: 0; }
        #trim-end { left: 100%; right: auto; }
        
        .trim-overlay {
            position: absolute;
            top: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(2px);
            z-index: 5;
            pointer-events: none;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.3); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 180, 216, 0.5); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--sea-deep); }
        
        /* 録音ボタンの波紋アニメーション */
        .pulse-red {
            box-shadow: 0 0 20px rgba(230, 57, 70, 0.6);
            animation: pulse-ring 2s infinite;
        }
        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(230, 57, 70, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(230, 57, 70, 0); }
            100% { box-shadow: 0 0 0 0 rgba(230, 57, 70, 0); }
        }

        input[type="range"] {
            accent-color: var(--sea-deep);
        }
    </style>
</head>
<body class="p-2 sm:p-4 flex flex-col items-center relative h-screen overflow-hidden">
    
    <!-- 背景の和柄アクセント（青海波をイメージした透かし） -->
    <div class="fixed inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(circle at 10px 10px, #0077b6 2px, transparent 0); background-size: 40px 40px;"></div>

    <header class="w-full max-w-5xl mb-2 flex justify-between items-center border-b border-[#00b4d8]/30 pb-2 relative z-10 shrink-0">
        <div class="flex items-center gap-2">
            <!-- アイコンを hime02.png に変更し、文字サイズに合わせた大きさに -->
            <img src="./hime02.png" alt="姫" class="h-6 w-6 object-contain drop-shadow-sm" onerror="this.src='https://placehold.co/512x512/transparent/0077b6?text=hime02';">
            <!-- 文字色をグラデーションではなく単色の濃い青にし、見やすく変更 -->
            <h1 class="text-xl md:text-2xl font-bold font-hime text-[#0077b6] tracking-wider drop-shadow-md">音ノ姫</h1>
        </div>
        <div id="status-badge" class="px-3 py-1 rounded-full text-[10px] font-bold border border-[#00b4d8] bg-white/50 text-[#0077b6] shadow-sm">支度中 (Ready)</div>
    </header>

    <main class="flex flex-col gap-2 w-full max-w-5xl relative z-10 flex-1 min-h-0">
        
        <!-- 上部：入力設定と録音コントロールを横並びに -->
        <div class="flex flex-col md:flex-row gap-2 shrink-0">
            <!-- 音の入り口セクション -->
            <section class="edo-panel p-2 md:p-3 flex-1 flex flex-col justify-center">
                <div class="flex flex-wrap md:flex-nowrap justify-between items-center gap-2 mb-2">
                    <h2 class="text-sm md:text-base font-hime text-[#0077b6] flex items-center gap-1 font-bold whitespace-nowrap">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                        音の入り口
                    </h2>
                    
                    <div class="flex flex-wrap items-center gap-2 w-full md:w-auto justify-end">
                        <label class="flex items-center gap-1 text-[11px] text-[#0077b6] font-medium cursor-pointer bg-white/60 px-2 py-1 rounded border border-white/80 shadow-sm whitespace-nowrap" title="iPad内蔵マイクはON、MOTU等のインターフェースはOFFを推奨">
                            <input type="checkbox" id="audio-processing-cb" checked class="w-3 h-3 rounded text-[#00b4d8] focus:ring-[#00b4d8]">
                            <span>補正 (iPad用)</span>
                        </label>

                        <select id="device-select" class="bg-white/60 text-[11px] font-medium border border-white/80 rounded text-[#0077b6] focus:ring-[#00b4d8] focus:border-[#00b4d8] py-1 px-2 max-w-[120px] truncate outline-none shadow-sm">
                            <option value="default">お任せ (Default)</option>
                        </select>
                        
                        <select id="channel-mode" class="bg-white/60 text-[11px] font-medium border border-white/80 rounded text-[#0077b6] focus:ring-[#00b4d8] focus:border-[#00b4d8] py-1 px-2 outline-none shadow-sm">
                            <option value="stereo">ステレオ</option>
                            <option value="mono-l">Ch1 モノ</option>
                        </select>
                        
                        <button id="init-audio-btn" class="btn-gold font-bold py-1 px-3 rounded text-[11px] whitespace-nowrap tracking-wide">
                            お繋ぎ
                        </button>
                    </div>
                </div>

                <!-- Volume Meter -->
                <div class="space-y-0.5">
                    <div class="flex justify-between text-[9px] text-[#0077b6] font-mono font-bold px-1">
                        <span>-60</span><span>-40</span><span>-20</span><span>-10</span><span>0 dB</span>
                    </div>
                    <div class="meter-container !height-[10px]">
                        <canvas id="volume-meter-canvas"></canvas>
                    </div>
                </div>
            </section>

            <!-- 録音コントロールセクション -->
            <section class="edo-panel p-2 md:p-3 flex flex-row items-center justify-between md:w-[280px] shrink-0 gap-4">
                <div class="flex flex-col items-start w-[120px]">
                    <div class="text-2xl md:text-3xl font-mono text-[#0077b6] font-bold tracking-wider drop-shadow-md z-10 leading-none" id="time-display">00:00.000</div>
                    <p id="rec-info" class="text-[10px] md:text-[11px] text-[#0077b6] mt-1 h-4 font-hime font-bold z-10 truncate w-full"></p>
                </div>
                
                <div class="flex gap-2 z-10 shrink-0">
                    <!-- 録音トグルボタン -->
                    <button id="record-btn" disabled class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-white/80 border-[2px] border-[#e63946]/50 flex items-center justify-center transition-all focus:outline-none hover:border-[#e63946] hover:bg-white shadow-md group">
                        <div id="record-icon" class="w-3 h-3 md:w-4 md:h-4 rounded-full bg-[#e63946] transition-all group-hover:scale-105 shadow-[0_2px_4px_rgba(230,57,70,0.5)]"></div>
                    </button>
                    
                    <!-- 再生トグルボタン -->
                    <button id="play-btn" disabled class="w-10 h-10 md:w-12 md:h-12 rounded-full bg-white/80 border-[2px] border-[#00b4d8]/50 flex items-center justify-center transition-all focus:outline-none hover:border-[#00b4d8] hover:bg-white shadow-md group hidden">
                         <div id="play-icon">
                             <svg class="w-5 h-5 md:w-6 md:h-6 text-[#00b4d8] ml-0.5 drop-shadow-sm group-hover:scale-105 transition-transform" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                         </div>
                         <div id="stop-play-icon" class="hidden w-3 h-3 md:w-4 md:h-4 bg-[#00b4d8] rounded-sm shadow-[0_2px_4px_rgba(0,180,216,0.5)]"></div>
                    </button>
                </div>
            </section>
        </div>

        <!-- エディタは最初からクリアに見えるように opacity や pointer-events-none を削除 -->
        <section id="editor-section" class="edo-panel p-2 md:p-3 flex flex-col flex-1 min-h-0">
            <!-- ツールバー -->
            <div class="flex justify-between items-center mb-1 shrink-0">
                <h2 class="font-hime text-[#0077b6] flex items-center gap-1 text-sm md:text-base font-bold whitespace-nowrap">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.121 14.121L19 19m-7-7l7-7m-7 7l-2.879 2.879M12 12L9.121 9.121m0 5.758a3 3 0 10-4.243 4.243 3 3 0 004.243-4.243zm0-5.758a3 3 0 10-4.243-4.243 3 3 0 004.243 4.243z"></path></svg>
                    切り結び (Edit)
                </h2>
                
                <div class="flex gap-2 items-center">
                    <!-- Undo/Redo Buttons -->
                    <div class="flex items-center bg-white/60 rounded p-1 border border-white/80 shadow-sm h-7">
                        <button id="undo-btn" disabled class="p-1 hover:bg-white/80 rounded text-[#0077b6] transition-colors disabled:opacity-30 disabled:cursor-not-allowed" title="戻す (Undo)">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"></path></svg>
                        </button>
                        <div class="w-[1px] h-4 bg-[#00b4d8]/30 mx-1"></div>
                        <button id="redo-btn" disabled class="p-1 hover:bg-white/80 rounded text-[#0077b6] transition-colors disabled:opacity-30 disabled:cursor-not-allowed" title="直す (Redo)">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 10h-10a8 8 0 00-8 8v2M21 10l-6 6m6-6l-6-6"></path></svg>
                        </button>
                    </div>

                    <!-- Zoom Controls -->
                    <div class="flex items-center bg-white/60 rounded p-1 border border-white/80 shadow-sm h-7">
                        <button id="zoom-out-btn" class="p-1 hover:bg-white/80 rounded text-[#0077b6] transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
                        </button>
                        <span id="zoom-level-display" class="text-xs font-mono font-bold px-1 md:px-2 text-[#0077b6] w-10 md:w-12 text-center">1.0x</span>
                        <button id="zoom-in-btn" class="p-1 hover:bg-white/80 rounded text-[#0077b6] transition-colors">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Waveform Editor -->
            <div class="waveform-container mb-1 flex-1 !h-auto min-h-[100px] max-h-[160px]" id="waveform-container">
                <div id="waveform-scroll-area" class="h-full relative min-w-full">
                    <canvas id="waveform-canvas" class="absolute top-0 left-0 w-full h-full"></canvas>
                    <div id="overlay-left" class="trim-overlay absolute top-0 bottom-0 left-0"></div>
                    <div id="overlay-right" class="trim-overlay absolute top-0 bottom-0"></div>
                    
                    <!-- 再生位置を示すプレイヘッド -->
                    <div id="playhead" class="absolute top-0 bottom-0 w-[2px] bg-[#e63946] z-10 pointer-events-none hidden shadow-[0_0_5px_#e63946] -ml-[1px]">
                        <!-- 掴みやすいツマミ -->
                        <div class="absolute -top-3 -left-[7px] w-4 h-4 rounded-full bg-[#e63946] border-2 border-white shadow-md"></div>
                    </div>

                    <div id="trim-start" class="trim-handle absolute !w-[16px]" data-type="start"></div>
                    <div id="trim-end" class="trim-handle absolute !w-[16px]" data-type="end"></div>
                </div>
            </div>
            
            <div class="flex justify-between text-[10px] md:text-[11px] text-[#0077b6] font-mono font-bold mb-2 px-1 shrink-0">
                <span id="trim-time-start">00:00.000</span>
                <span id="trim-duration" class="text-[#00b4d8]">Duration: 00:00.000</span>
                <span id="trim-time-end">00:00.000</span>
            </div>

            <!-- ▼▼ 波形下のコントロールエリア (50:50分割) ▼▼ -->
            <div class="flex flex-row gap-2 md:gap-4 flex-1 min-h-0 shrink-0 mt-1">
                
                <!-- 左側：姫画像エリア (枠・背景を削除し、画像を大きく表示) -->
                <div class="w-1/2 shrink-0 relative flex items-end justify-center overflow-hidden">
                    <!-- object-contain から object-cover等に変更するか、スケールを調整して大きく見せる -->
                    <!-- scale-125 や translate-y などを駆使して、透過PNGの余白を詰める -->
                    <img src="./hime01.PNG" alt="音ノ姫" class="w-[120%] h-[120%] max-w-none object-contain drop-shadow-md origin-bottom transform translate-y-[10%]" onerror="this.src='https://placehold.co/1437x1095/transparent/0077b6?text=hime01.PNG';">
                </div>

                <!-- 右側：編集・書き出しコントロール (w-1/2 shrink-0 で固定50%) -->
                <div class="w-1/2 shrink-0 bg-white/40 p-2 md:p-4 rounded-xl border border-white/60 shadow-sm flex flex-col justify-between gap-1 md:gap-2 overflow-y-auto">
                    
                    <!-- Gain Controls -->
                    <div class="flex flex-col gap-1 md:gap-2">
                        <div class="flex justify-between items-end">
                            <span class="text-xs md:text-sm font-bold text-[#00b4d8]">Gain:</span>
                            <span id="gain-val-display" class="text-xs md:text-sm font-mono font-bold text-[#0077b6]">0dB</span>
                        </div>
                        <div class="flex items-center gap-1 md:gap-2">
                            <input type="range" id="gain-slider" min="-20" max="20" step="1" value="0" class="flex-1 h-4 md:h-5 bg-white/80 rounded-lg appearance-none cursor-pointer shadow-inner border border-white/50 accent-[#0077b6]">
                            <button id="apply-gain-btn" class="text-xs md:text-sm py-1.5 md:py-2 px-2 md:px-3 rounded-lg border border-[#00b4d8] font-bold text-[#00b4d8] bg-white hover:bg-[#00b4d8] hover:text-white transition-colors shadow-sm whitespace-nowrap">適用</button>
                        </div>
                    </div>

                    <div class="h-[1px] bg-[#00b4d8]/20 w-full my-1"></div>

                    <!-- Normalize -->
                    <button id="normalize-btn" class="btn-gold py-2 md:py-2.5 px-2 md:px-4 rounded-lg transition-colors text-xs md:text-sm flex items-center justify-center gap-1 md:gap-2 font-bold w-full shadow-md shrink-0">
                        <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-8m-4 8l-4-8"></path></svg>
                        最大化 (Normalize)
                    </button>

                    <div class="h-[1px] bg-[#00b4d8]/20 w-full my-1"></div>

                    <!-- Export -->
                    <div class="flex flex-col gap-1 md:gap-2 shrink-0">
                        <button id="export-wav-btn" class="w-full bg-white/80 hover:bg-white border border-[#00b4d8]/50 text-[#0077b6] font-bold py-1.5 md:py-2 px-1 md:px-2 text-[10px] md:text-xs rounded-lg transition-colors flex items-center justify-center gap-1 shadow-sm">
                            <svg class="w-3 h-3 md:w-4 md:h-4 text-[#00b4d8]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            蔵へ納める (WAV)
                        </button>
                        <button id="export-mp3-btn" class="w-full bg-white/80 hover:bg-white border border-[#00b4d8]/50 text-[#0077b6] font-bold py-1.5 md:py-2 px-1 md:px-2 text-[10px] md:text-xs rounded-lg transition-colors flex items-center justify-center gap-1 shadow-sm">
                            <svg class="w-3 h-3 md:w-4 md:h-4 text-[#00b4d8]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            文で送る (MP3)
                        </button>
                    </div>
                </div>
            </div>
            <!-- ▲▲ ここまで ▲▲ -->

        </section>
        
        <div id="message-modal" class="fixed inset-0 bg-white/20 backdrop-blur-md flex items-center justify-center z-50 hidden opacity-0 transition-opacity">
            <div class="edo-panel p-6 max-w-sm w-full mx-4 border-white shadow-2xl">
                <h3 id="modal-title" class="text-2xl font-hime font-bold text-[#0077b6] mb-3">御触れ</h3>
                <p id="modal-body" class="text-[#005f9e] mb-6 text-sm font-medium leading-relaxed"></p>
                <div class="flex justify-end">
                    <button id="modal-close-btn" class="btn-gold font-bold py-1.5 px-6 rounded-md transition-colors">
                        承知
                    </button>
                </div>
            </div>
        </div>

    </main>

    <script>
        // --- Core Audio Variables ---
        let audioContext;
        let mediaStreamSource;
        let analyser;
        let mediaStream;
        let scriptProcessor; // Recording processor (並列ルーティング用)
        
        // Recording state
        let isRecording = false;
        let isPlaying = false;
        let recordedBuffersL = [];
        let recordedBuffersR = [];
        let recordingLength = 0;
        let sampleRate = 48000;
        let startTime = 0;
        let timerInterval;
        let animationFrameId;

        // Edit state
        let currentAudioBuffer = null;
        let trimStartRatio = 0; 
        let trimEndRatio = 1.0; 
        let playheadTime = 0; 
        let playbackSourceNode = null;
        let zoomLevel = 1.0;

        // Undo/Redo State
        let editHistory = [];
        let historyIndex = -1;

        // UI Elements
        const initAudioBtn = document.getElementById('init-audio-btn');
        const deviceSelect = document.getElementById('device-select');
        const channelModeSelect = document.getElementById('channel-mode');
        const audioProcessingCb = document.getElementById('audio-processing-cb');
        
        const recordBtn = document.getElementById('record-btn');
        const recordIcon = document.getElementById('record-icon');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const stopPlayIcon = document.getElementById('stop-play-icon');
        const timeDisplay = document.getElementById('time-display');
        const recInfo = document.getElementById('rec-info');
        const statusBadge = document.getElementById('status-badge');
        
        const editorSection = document.getElementById('editor-section');
        const normalizeBtn = document.getElementById('normalize-btn');
        const exportWavBtn = document.getElementById('export-wav-btn');
        const exportMp3Btn = document.getElementById('export-mp3-btn');
        
        // Canvas Elements
        const meterCanvas = document.getElementById('volume-meter-canvas');
        const meterCtx = meterCanvas.getContext('2d');
        const waveCanvas = document.getElementById('waveform-canvas');
        const waveCtx = waveCanvas.getContext('2d');
        const waveContainer = document.getElementById('waveform-container');
        const waveScrollArea = document.getElementById('waveform-scroll-area');
        
        // Editor Controls (Zoom, Gain, Undo/Redo)
        const zoomInBtn = document.getElementById('zoom-in-btn');
        const zoomOutBtn = document.getElementById('zoom-out-btn');
        const zoomLevelDisplay = document.getElementById('zoom-level-display');
        const gainSlider = document.getElementById('gain-slider');
        const gainValDisplay = document.getElementById('gain-val-display');
        const applyGainBtn = document.getElementById('apply-gain-btn');
        const undoBtn = document.getElementById('undo-btn');
        const redoBtn = document.getElementById('redo-btn');

        // Trim UI
        const trimStartHandle = document.getElementById('trim-start');
        const trimEndHandle = document.getElementById('trim-end');
        const overlayLeft = document.getElementById('overlay-left');
        const overlayRight = document.getElementById('overlay-right');
        const trimTimeStartDisplay = document.getElementById('trim-time-start');
        const trimTimeEndDisplay = document.getElementById('trim-time-end');
        const trimDurationDisplay = document.getElementById('trim-duration');
        const playheadEl = document.getElementById('playhead');

        // Modal
        const modal = document.getElementById('message-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            const ms = Math.floor((seconds % 1) * 1000);
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}.${ms.toString().padStart(3, '0')}`;
        }

        function showModal(title, message) {
            modalTitle.textContent = title;
            modalBody.textContent = message;
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }

        modalCloseBtn.addEventListener('click', () => {
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        });

        // --- Undo / Redo Functions ---
        function cloneAudioBuffer(src) {
            if (!src || !audioContext) return null;
            const cloned = audioContext.createBuffer(src.numberOfChannels, src.length, src.sampleRate);
            for (let c = 0; c < src.numberOfChannels; c++) {
                cloned.copyToChannel(src.getChannelData(c), c);
            }
            return cloned;
        }

        function pushHistorySnapshot() {
            if (!currentAudioBuffer) return;
            const snapshot = {
                buffer: cloneAudioBuffer(currentAudioBuffer),
                trimStartRatio: trimStartRatio,
                trimEndRatio: trimEndRatio
            };
            
            // 現在のインデックスより先の履歴は削除
            editHistory = editHistory.slice(0, historyIndex + 1);
            editHistory.push(snapshot);
            
            // 履歴の最大数を10に制限
            if (editHistory.length > 10) {
                editHistory.shift();
            } else {
                historyIndex++;
            }
            updateHistoryButtons();
        }

        function updateHistoryButtons() {
            undoBtn.disabled = historyIndex <= 0;
            redoBtn.disabled = historyIndex >= editHistory.length - 1;
        }

        function restoreFromSnapshot(snapshot) {
            if (isPlaying) stopPlayback();
            currentAudioBuffer = cloneAudioBuffer(snapshot.buffer);
            trimStartRatio = snapshot.trimStartRatio;
            trimEndRatio = snapshot.trimEndRatio;
            
            // 再生位置をトリム開始位置にリセット
            playheadTime = trimStartRatio * currentAudioBuffer.duration;
            
            // スライダーをリセット
            gainSlider.value = 0;
            gainValDisplay.textContent = "0dB";
            
            updateTrimUI();
            drawWaveform(currentAudioBuffer);
            updateHistoryButtons();
        }

        undoBtn.addEventListener('click', () => {
            if (historyIndex > 0) {
                historyIndex--;
                restoreFromSnapshot(editHistory[historyIndex]);
            }
        });

        redoBtn.addEventListener('click', () => {
            if (historyIndex < editHistory.length - 1) {
                historyIndex++;
                restoreFromSnapshot(editHistory[historyIndex]);
            }
        });

        async function updateDeviceList() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioInputs = devices.filter(device => device.kind === 'audioinput');
                
                const currentVal = deviceSelect.value;
                deviceSelect.innerHTML = '';
                
                const defaultOption = document.createElement('option');
                defaultOption.value = 'default';
                defaultOption.text = 'お任せ (本体マイク / 自動)';
                deviceSelect.appendChild(defaultOption);
                
                audioInputs.forEach((device, index) => {
                    if (device.deviceId && device.deviceId !== 'default') {
                        const option = document.createElement('option');
                        option.value = device.deviceId;
                        option.text = device.label || `Microphone ${index + 1}`;
                        deviceSelect.appendChild(option);
                    }
                });

                if (currentVal && Array.from(deviceSelect.options).some(opt => opt.value === currentVal)) {
                    deviceSelect.value = currentVal;
                }
            } catch (err) {
                console.error("Error enumerating devices:", err);
            }
        }

        deviceSelect.addEventListener('change', () => {
            if (mediaStream) initAudioBtn.click(); 
        });

        if (navigator.mediaDevices.ondevicechange !== undefined) {
            navigator.mediaDevices.ondevicechange = updateDeviceList;
        }

        navigator.mediaDevices.enumerateDevices().then(devices => {
            if (devices.some(d => d.label !== "")) updateDeviceList();
        });

        initAudioBtn.addEventListener('click', async () => {
            // Safari対策: ユーザーアクション同期でContext生成、48kHz完全固定
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
            }
            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }

            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
            }

            try {
                const useProcessing = audioProcessingCb.checked;
                
                // Safari対策: exactを避け ideal を使用
                const audioConstraints = {
                    echoCancellation: useProcessing,
                    noiseSuppression: useProcessing,
                    autoGainControl: useProcessing,
                    channelCount: { ideal: 2 } 
                };
                
                if (deviceSelect.value && deviceSelect.value !== 'default') {
                    audioConstraints.deviceId = { ideal: deviceSelect.value };
                }

                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: audioConstraints });
                
                sampleRate = audioContext.sampleRate; // 48000
                mediaStreamSource = audioContext.createMediaStreamSource(mediaStream);
                
                // --- 【並列ルーティング】 (音質劣化防止) ---
                
                // 分岐1: メーター用 (録音には影響させない)
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 1024;
                analyser.smoothingTimeConstant = 0.3;
                mediaStreamSource.connect(analyser); 
                
                // 分岐2: 録音用 (純度100%の原音をそのままScriptProcessorへ)
                scriptProcessor = audioContext.createScriptProcessor(4096, 2, 2);
                scriptProcessor.onaudioprocess = handleAudioProcess;
                mediaStreamSource.connect(scriptProcessor); 
                scriptProcessor.connect(audioContext.destination);

                // UI Updates
                recordBtn.disabled = false;
                initAudioBtn.textContent = "接続完了";
                initAudioBtn.classList.replace('btn-gold', 'bg-[#00b4d8]');
                initAudioBtn.classList.add('text-white', 'border-none');
                
                statusBadge.textContent = `収音中 (${sampleRate}Hz)`;
                statusBadge.classList.replace('border-[#00b4d8]', 'border-[#0077b6]');
                statusBadge.classList.replace('text-[#0077b6]', 'text-[#0077b6]');
                statusBadge.classList.replace('bg-white/50', 'bg-[#00b4d8]/20');
                
                if(animationFrameId) cancelAnimationFrame(animationFrameId);
                drawMeter();
                await updateDeviceList();

            } catch (err) {
                console.error("Initialization error:", err);
                const detail = err.name ? `[${err.name}] ` : '';
                showModal("お繋ぎ失敗", detail + (err.message || "マイクへのアクセスに失敗いたしました。設定が許可されているか確認してくだされ。"));
            }
        });

        function handleAudioProcess(e) {
            if (!isRecording) return;

            const inputBuffer = e.inputBuffer;
            const mode = channelModeSelect.value;
            
            const inputDataL = inputBuffer.getChannelData(0);
            let inputDataR;
            
            if (mode === 'mono-l') {
                inputDataR = new Float32Array(inputDataL);
            } else {
                inputDataR = inputBuffer.numberOfChannels > 1 ? inputBuffer.getChannelData(1) : new Float32Array(inputDataL);
            }

            recordedBuffersL.push(new Float32Array(inputDataL));
            recordedBuffersR.push(new Float32Array(inputDataR));
            recordingLength += inputBuffer.length;
        }

        function drawMeter() {
            if (!analyser) return;

            const width = meterCanvas.clientWidth;
            const height = meterCanvas.clientHeight;
            if (meterCanvas.width !== width || meterCanvas.height !== height) {
                meterCanvas.width = width;
                meterCanvas.height = height;
            }

            const dataArray = new Float32Array(analyser.fftSize);
            analyser.getFloatTimeDomainData(dataArray);

            let sumSquares = 0;
            for (let i = 0; i < dataArray.length; i++) {
                sumSquares += dataArray[i] * dataArray[i];
            }
            const rms = Math.sqrt(sumSquares / dataArray.length);
            
            let db = 20 * Math.log10(rms);
            if (db < -60) db = -60;
            if (db > 0) db = 0;

            const percent = (db + 60) / 60;
            const barWidth = width * percent;

            meterCtx.clearRect(0, 0, width, height);

            const gradient = meterCtx.createLinearGradient(0, 0, width, 0);
            gradient.addColorStop(0, '#00b4d8');
            gradient.addColorStop(0.7, '#d4af37');
            gradient.addColorStop(0.9, '#e63946');

            meterCtx.fillStyle = gradient;
            meterCtx.fillRect(0, 0, barWidth, height);
            
            meterCtx.fillStyle = 'rgba(255,255,255,0.3)';
            [width*0.33, width*0.66, width*0.83].forEach(x => {
                meterCtx.fillRect(x, 0, 1, height);
            });

            animationFrameId = requestAnimationFrame(drawMeter);
        }

        recordBtn.addEventListener('click', () => {
            if (!isRecording) {
                // 録音開始
                recordedBuffersL = [];
                recordedBuffersR = [];
                recordingLength = 0;
                isRecording = true;
                startTime = audioContext.currentTime;
                
                playBtn.classList.add('hidden');
                if (isPlaying) stopPlayback();
                
                // 録音中のエディタセクションの無効化
                editorSection.classList.add('pointer-events-none');
                editorSection.classList.add('opacity-50');
                
                recordIcon.classList.remove('rounded-full');
                recordIcon.classList.add('rounded-sm');
                recordBtn.classList.add('pulse-red');
                
                statusBadge.textContent = "録音中...";
                statusBadge.classList.replace('text-[#0077b6]', 'text-[#e63946]');
                statusBadge.classList.replace('border-[#0077b6]', 'border-[#e63946]');
                statusBadge.classList.replace('bg-[#00b4d8]/20', 'bg-[#e63946]/10');
                
                timerInterval = setInterval(() => {
                    const elapsed = audioContext.currentTime - startTime;
                    timeDisplay.textContent = formatTime(elapsed);
                }, 50); 
            } else {
                // 録音停止
                isRecording = false;
                clearInterval(timerInterval);
                
                playBtn.classList.remove('hidden');
                playBtn.disabled = false;
                
                recordIcon.classList.add('rounded-full');
                recordIcon.classList.remove('rounded-sm');
                recordBtn.classList.remove('pulse-red');
                
                statusBadge.textContent = "切り結び (Editing)";
                statusBadge.classList.replace('text-[#e63946]', 'text-[#0077b6]');
                statusBadge.classList.replace('border-[#e63946]', 'border-[#0077b6]');
                statusBadge.classList.replace('bg-[#e63946]/10', 'bg-[#00b4d8]/20');
                
                processRecording();
            }
        });

        function processRecording() {
            if (recordingLength === 0) {
                showModal("お知らせ", "音が記録されておらぬようです。");
                return;
            }

            recInfo.textContent = `生成中... ${formatTime(recordingLength/sampleRate)}`;

            const flatL = new Float32Array(recordingLength);
            const flatR = new Float32Array(recordingLength);
            let offset = 0;
            
            for (let i = 0; i < recordedBuffersL.length; i++) {
                flatL.set(recordedBuffersL[i], offset);
                flatR.set(recordedBuffersR[i], offset);
                offset += recordedBuffersL[i].length;
            }

            currentAudioBuffer = audioContext.createBuffer(2, recordingLength, sampleRate);
            currentAudioBuffer.copyToChannel(flatL, 0);
            currentAudioBuffer.copyToChannel(flatR, 1);

            recordedBuffersL = [];
            recordedBuffersR = [];

            trimStartRatio = 0;
            trimEndRatio = 1;
            zoomLevel = 1.0;
            zoomLevelDisplay.textContent = '1.0x';
            playheadTime = 0;
            
            // 履歴のリセットと初期状態の保存
            editHistory = [];
            historyIndex = -1;
            pushHistorySnapshot();
            
            updateTrimUI();
            drawWaveform(currentAudioBuffer);
            
            editorSection.classList.remove('pointer-events-none');
            editorSection.classList.remove('opacity-50');
            recInfo.textContent = `記録完了 ${formatTime(currentAudioBuffer.duration)}`;
        }

        function drawWaveform(buffer) {
            if (!buffer) return;
            const containerWidth = waveContainer.clientWidth || 300;
            const width = Math.max(containerWidth, containerWidth * zoomLevel);
            const height = waveContainer.clientHeight || 100;
            
            waveScrollArea.style.width = width + 'px';
            
            waveCanvas.width = width * window.devicePixelRatio;
            waveCanvas.height = height * window.devicePixelRatio;
            waveCanvas.style.width = width + 'px';
            waveCanvas.style.height = height + 'px';
            
            waveCtx.scale(window.devicePixelRatio, window.devicePixelRatio);
            waveCtx.clearRect(0, 0, width, height);

            const data = buffer.getChannelData(0);
            const step = Math.ceil(data.length / width);
            const amp = height / 2;

            waveCtx.fillStyle = '#fdfbf7'; // Sand white
            waveCtx.fillRect(0, 0, width, height);
            
            waveCtx.beginPath();
            
            // Center Line
            waveCtx.moveTo(0, amp);
            waveCtx.lineTo(width, amp);
            waveCtx.strokeStyle = 'rgba(212, 175, 55, 0.4)'; 
            waveCtx.stroke();

            // 元の波形描画
            waveCtx.beginPath();
            for (let i = 0; i < width; i++) {
                let min = 1.0;
                let max = -1.0;
                for (let j = 0; j < step; j++) {
                    const datum = data[(i * step) + j];
                    if (datum < min) min = datum;
                    if (datum > max) max = datum;
                }
                waveCtx.moveTo(i, (1 + min) * amp);
                waveCtx.lineTo(i, (1 + max) * amp);
            }
            waveCtx.strokeStyle = '#00b4d8'; // Clear blue
            waveCtx.lineWidth = 1;
            waveCtx.stroke();

            // Gainプレビューのリアルタイムオーバーレイ表示
            const previewDb = parseInt(gainSlider.value) || 0;
            if (previewDb !== 0) {
                const multiplier = Math.pow(10, previewDb / 20);
                waveCtx.beginPath();
                for (let i = 0; i < width; i++) {
                    let min = 1.0;
                    let max = -1.0;
                    for (let j = 0; j < step; j++) {
                        const datum = data[(i * step) + j] * multiplier;
                        const clamped = Math.max(-1.0, Math.min(1.0, datum));
                        if (clamped < min) min = clamped;
                        if (clamped > max) max = clamped;
                    }
                    waveCtx.moveTo(i, (1 + min) * amp);
                    waveCtx.lineTo(i, (1 + max) * amp);
                }
                waveCtx.strokeStyle = 'rgba(212, 175, 55, 0.8)'; // 江戸の金
                waveCtx.lineWidth = 1.5;
                waveCtx.stroke();
                
                // テキスト表示
                waveCtx.fillStyle = '#d4af37';
                waveCtx.font = "bold 12px 'Noto Sans JP', sans-serif";
                waveCtx.fillText(`Gain Preview: ${previewDb > 0 ? '+' : ''}${previewDb}dB`, 10, height - 10);
            }
        }

        let isDragging = false;
        let activeHandle = null;
        let isDraggingPlayhead = false;
        let wasPlayingBeforeDrag = false;
        let initialTrimStartRatio = 0;
        let initialTrimEndRatio = 1;

        function updateTrimUI() {
            if (!currentAudioBuffer) return;
            
            const w = waveScrollArea.clientWidth; 
            const startPx = trimStartRatio * w;
            const endPx = trimEndRatio * w;

            trimStartHandle.style.left = startPx + 'px';
            trimEndHandle.style.left = endPx + 'px';

            overlayLeft.style.width = startPx + 'px';
            overlayRight.style.left = endPx + 'px';
            overlayRight.style.width = Math.max(0, w - endPx) + 'px';

            const dur = currentAudioBuffer.duration;
            const tStart = trimStartRatio * dur;
            const tEnd = trimEndRatio * dur;
            
            if (playheadTime < tStart) playheadTime = tStart;
            if (playheadTime > tEnd) playheadTime = tEnd;
            updatePlayheadUI();

            trimTimeStartDisplay.textContent = formatTime(tStart);
            trimTimeEndDisplay.textContent = formatTime(tEnd);
            trimDurationDisplay.textContent = `尺(Duration): ${formatTime(tEnd - tStart)}`;
            
            if (!isPlaying) {
                timeDisplay.textContent = formatTime(playheadTime);
            }
        }

        function updatePlayheadUI() {
            if (!currentAudioBuffer) return;
            const dur = currentAudioBuffer.duration;
            const w = waveScrollArea.clientWidth;
            const px = (playheadTime / dur) * w;
            playheadEl.style.left = px + 'px';
            playheadEl.classList.remove('hidden');
        }

        window.addEventListener('resize', () => {
            if (currentAudioBuffer) {
                drawWaveform(currentAudioBuffer);
                updateTrimUI();
            }
        });

        function handlePointerDown(e) {
            if (e.target === trimStartHandle || e.target === trimEndHandle) {
                isDragging = true;
                activeHandle = e.target.dataset.type; 
                initialTrimStartRatio = trimStartRatio;
                initialTrimEndRatio = trimEndRatio;
                if(e.pointerId) e.target.setPointerCapture(e.pointerId);
                e.preventDefault(); 
            } else if (e.target.closest('#waveform-scroll-area') && !e.target.closest('.trim-handle')) {
                isDraggingPlayhead = true;
                wasPlayingBeforeDrag = isPlaying;
                if (isPlaying) stopPlayback();
                if (e.pointerId) waveScrollArea.setPointerCapture(e.pointerId);
                e.preventDefault();
                updatePlayheadFromEvent(e);
            }
        }

        function handlePointerMove(e) {
            if (isDragging || isDraggingPlayhead) e.preventDefault();
            if (!isDragging && !isDraggingPlayhead) return;
            
            if (isDragging && activeHandle) {
                const rect = waveScrollArea.getBoundingClientRect();
                const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
                
                let x = clientX - rect.left;
                x = Math.max(0, Math.min(x, rect.width));
                let ratio = x / rect.width;

                if (activeHandle === 'start') {
                    if (ratio >= trimEndRatio - 0.005) ratio = trimEndRatio - 0.005;
                    trimStartRatio = ratio;
                } else if (activeHandle === 'end') {
                    if (ratio <= trimStartRatio + 0.005) ratio = trimStartRatio + 0.005;
                    trimEndRatio = ratio;
                }
                updateTrimUI();
            } else if (isDraggingPlayhead) {
                updatePlayheadFromEvent(e);
            }
        }

        function handlePointerUp(e) {
            if (isDragging && activeHandle && e.pointerId && e.target.releasePointerCapture) {
                e.target.releasePointerCapture(e.pointerId);
            }
            if (isDraggingPlayhead && e.pointerId && waveScrollArea.releasePointerCapture) {
                waveScrollArea.releasePointerCapture(e.pointerId);
            }
            
            if (isDraggingPlayhead && wasPlayingBeforeDrag) {
                startPlayback();
            }
            
            // Undo/Redo のための履歴追加 (トリム操作後)
            if (isDragging && activeHandle) {
                if (trimStartRatio !== initialTrimStartRatio || trimEndRatio !== initialTrimEndRatio) {
                    pushHistorySnapshot();
                }
            }
            
            isDragging = false;
            activeHandle = null;
            isDraggingPlayhead = false;
            wasPlayingBeforeDrag = false;
        }

        function updatePlayheadFromEvent(e) {
            if (!currentAudioBuffer) return;
            const rect = waveScrollArea.getBoundingClientRect();
            const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
            let x = clientX - rect.left;
            let ratio = x / rect.width;
            const dur = currentAudioBuffer.duration;

            if (ratio < trimStartRatio) ratio = trimStartRatio;
            if (ratio > trimEndRatio) ratio = trimEndRatio;

            playheadTime = ratio * dur;
            updatePlayheadUI();

            if (!isPlaying) {
                timeDisplay.textContent = formatTime(playheadTime);
            }
        }

        trimStartHandle.addEventListener('pointerdown', handlePointerDown);
        trimEndHandle.addEventListener('pointerdown', handlePointerDown);
        waveScrollArea.addEventListener('pointerdown', handlePointerDown);
        window.addEventListener('pointermove', handlePointerMove, {passive: false});
        window.addEventListener('pointerup', handlePointerUp);
        
        // Touch fallback
        trimStartHandle.addEventListener('touchstart', handlePointerDown, {passive: false});
        trimEndHandle.addEventListener('touchstart', handlePointerDown, {passive: false});
        waveScrollArea.addEventListener('touchstart', handlePointerDown, {passive: false});
        window.addEventListener('touchmove', handlePointerMove, {passive: false});
        window.addEventListener('touchend', handlePointerUp);

        function updateZoom() {
            zoomLevelDisplay.textContent = zoomLevel.toFixed(1) + 'x';
            if (currentAudioBuffer) {
                drawWaveform(currentAudioBuffer);
                updateTrimUI();
            }
        }

        zoomInBtn.addEventListener('click', () => {
            if (zoomLevel < 10.0) {
                zoomLevel += 0.5;
                updateZoom();
            }
        });

        zoomOutBtn.addEventListener('click', () => {
            if (zoomLevel > 1.0) {
                zoomLevel -= 0.5;
                if (zoomLevel < 1.0) zoomLevel = 1.0;
                updateZoom();
            }
        });

        gainSlider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            gainValDisplay.textContent = (val > 0 ? '+' : '') + val + 'dB';
            if (currentAudioBuffer) {
                drawWaveform(currentAudioBuffer);
            }
        });

        applyGainBtn.addEventListener('click', () => {
            if (!currentAudioBuffer) return;
            const db = parseFloat(gainSlider.value);
            if (db === 0) return;

            recInfo.textContent = "音量調整中...";
            
            setTimeout(() => {
                const multiplier = Math.pow(10, db / 20);
                const len = currentAudioBuffer.length;
                const chL = currentAudioBuffer.getChannelData(0);
                const chR = currentAudioBuffer.getChannelData(1);
                
                let clipped = false;

                for (let i = 0; i < len; i++) {
                    let nL = chL[i] * multiplier;
                    let nR = chR[i] * multiplier;
                    
                    if (Math.abs(nL) > 1.0 || Math.abs(nR) > 1.0) clipped = true;
                    
                    chL[i] = Math.max(-1.0, Math.min(1.0, nL));
                    chR[i] = Math.max(-1.0, Math.min(1.0, nR));
                }

                gainSlider.value = 0;
                gainValDisplay.textContent = "0dB";
                
                // 変更を履歴に追加
                pushHistorySnapshot();
                
                drawWaveform(currentAudioBuffer);
                
                const msg = clipped 
                    ? `音量を変更いたしました (${db > 0 ? '+' : ''}${db}dB)。\n※一部の音が限界を超え、歪みが発生しております。` 
                    : `音量を変更いたしました (${db > 0 ? '+' : ''}${db}dB)。`;
                showModal("音量調整 完了", msg);
                
                recInfo.textContent = `記録完了 ${formatTime(currentAudioBuffer.duration)}`;
            }, 50);
        });

        function startPlayback() {
            if (!currentAudioBuffer) return;
            
            const dur = currentAudioBuffer.duration;
            const tStart = trimStartRatio * dur;
            const tEnd = trimEndRatio * dur;
            
            if (playheadTime >= tEnd - 0.01) {
                playheadTime = tStart;
                updatePlayheadUI();
            }

            const playDur = tEnd - playheadTime;

            playbackSourceNode = audioContext.createBufferSource();
            playbackSourceNode.buffer = currentAudioBuffer;
            playbackSourceNode.connect(audioContext.destination);
            
            playbackSourceNode.start(0, playheadTime, playDur);
            isPlaying = true;
            
            playIcon.classList.add('hidden');
            stopPlayIcon.classList.remove('hidden');
            playBtn.classList.add('border-[#0077b6]'); 
            
            let playStartTime = audioContext.currentTime;
            let startOffset = playheadTime;
            
            const drawPlayhead = () => {
                if (!isPlaying) return;
                const elapsed = audioContext.currentTime - playStartTime;
                playheadTime = startOffset + elapsed;
                
                if (playheadTime >= tEnd) {
                    stopPlayback();
                    playheadTime = tStart; 
                    updatePlayheadUI();
                    timeDisplay.textContent = formatTime(playheadTime);
                    return;
                }
                
                timeDisplay.textContent = formatTime(playheadTime);
                updatePlayheadUI();
                requestAnimationFrame(drawPlayhead);
            };
            requestAnimationFrame(drawPlayhead);

            playbackSourceNode.onended = () => {
                if(isPlaying) {
                    stopPlayback();
                    playheadTime = tStart;
                    updatePlayheadUI();
                    timeDisplay.textContent = formatTime(playheadTime);
                }
            };
        }

        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                stopPlayback();
                return;
            }
            startPlayback();
        });

        function stopPlayback() {
            if (playbackSourceNode) {
                try { playbackSourceNode.stop(); } catch(e){}
                playbackSourceNode.disconnect();
                playbackSourceNode = null;
            }
            isPlaying = false;
            playIcon.classList.remove('hidden');
            stopPlayIcon.classList.add('hidden');
            playBtn.classList.remove('border-[#0077b6]');
            updateTrimUI(); 
        }

        normalizeBtn.addEventListener('click', () => {
            if (!currentAudioBuffer) return;
            
            recInfo.textContent = "最大化中...";
            
            setTimeout(() => {
                const len = currentAudioBuffer.length;
                const chL = currentAudioBuffer.getChannelData(0);
                const chR = currentAudioBuffer.getChannelData(1);
                
                let maxPeak = 0;
                for (let i = 0; i < len; i++) {
                    const absL = Math.abs(chL[i]);
                    const absR = Math.abs(chR[i]);
                    if (absL > maxPeak) maxPeak = absL;
                    if (absR > maxPeak) maxPeak = absR;
                }

                if (maxPeak > 0 && maxPeak < 1.0) {
                    const targetGain = Math.pow(10, -0.3 / 20);
                    const multiplier = targetGain / maxPeak;
                    for (let i = 0; i < len; i++) {
                        chL[i] *= multiplier;
                        chR[i] *= multiplier;
                    }
                    
                    gainSlider.value = 0; 
                    gainValDisplay.textContent = "0dB";
                    
                    // 変更を履歴に追加
                    pushHistorySnapshot();
                    
                    drawWaveform(currentAudioBuffer);
                    showModal("最大化 完了", `全体の音量を ${(20 * Math.log10(multiplier)).toFixed(2)} dB 引き上げました。`);
                } else {
                     showModal("お知らせ", "既に最大音量に達しているか、無音でござりまする。");
                }
                recInfo.textContent = `記録完了 ${formatTime(currentAudioBuffer.duration)}`;
            }, 50);
        });

        function getTrimmedData() {
            const totalSamples = currentAudioBuffer.length;
            const startSample = Math.floor(trimStartRatio * totalSamples);
            const endSample = Math.floor(trimEndRatio * totalSamples);
            const durationSamples = endSample - startSample;

            const trimmedL = new Float32Array(durationSamples);
            const trimmedR = new Float32Array(durationSamples);
            
            currentAudioBuffer.copyFromChannel(trimmedL, 0, startSample);
            currentAudioBuffer.copyFromChannel(trimmedR, 1, startSample);
            
            return { l: trimmedL, r: trimmedR, length: durationSamples };
        }

        function floatToInt16(float32Array) {
            const int16Array = new Int16Array(float32Array.length);
            for (let i = 0; i < float32Array.length; i++) {
                let v = float32Array[i];
                int16Array[i] = Math.max(-32768, Math.min(32767, v < 0 ? v * 32768 : v * 32767));
            }
            return int16Array;
        }

        async function saveOrShare(blob, filename) {
            const file = new File([blob], filename, { type: blob.type });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        title: '音ノ姫 - 録音データ',
                        files: [file]
                    });
                    return; 
                } catch (err) {
                    if (err.name !== 'AbortError') console.error("Share failed:", err);
                }
            }

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 100);
        }

        exportWavBtn.addEventListener('click', async () => {
            if (!currentAudioBuffer) return;
            
            const btnOriginalText = exportWavBtn.innerHTML;
            exportWavBtn.innerHTML = "処理中...";
            exportWavBtn.disabled = true;

            await new Promise(r => setTimeout(r, 50));

            const { l, r, length } = getTrimmedData();
            
            const interleaved = new Float32Array(length * 2);
            for (let i = 0; i < length; i++) {
                interleaved[i * 2] = l[i];
                interleaved[i * 2 + 1] = r[i];
            }

            const dataview = encodeWAV(interleaved, sampleRate);
            const audioBlob = new Blob([dataview], { type: 'audio/wav' });
            
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
            await saveOrShare(audioBlob, `OtoNoHime_${timestamp}.wav`);

            exportWavBtn.innerHTML = btnOriginalText;
            exportWavBtn.disabled = false;
        });

        function encodeWAV(samples, sampleRate) {
            const buffer = new ArrayBuffer(44 + samples.length * 2);
            const view = new DataView(buffer);

            const writeString = (view, offset, string) => {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            };

            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + samples.length * 2, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true); 
            view.setUint16(20, 1, true); 
            view.setUint16(22, 2, true); 
            view.setUint32(24, sampleRate, true); 
            view.setUint32(28, sampleRate * 4, true); 
            view.setUint16(32, 4, true); 
            view.setUint16(34, 16, true); 
            writeString(view, 36, 'data');
            view.setUint32(40, samples.length * 2, true);

            let offset = 44;
            for (let i = 0; i < samples.length; i++, offset += 2) {
                let s = samples[i];
                view.setInt16(offset, Math.max(-32768, Math.min(32767, s < 0 ? s * 32768 : s * 32767)), true);
            }

            return view;
        }

        exportMp3Btn.addEventListener('click', async () => {
            if (!currentAudioBuffer) return;
            if (typeof lamejs === 'undefined') {
                showModal("申し訳ござらぬ", "MP3変換器の呼び出しに失敗いたしました。電波の良い場所でお試しくだされ。");
                return;
            }

            const btnOriginalText = exportMp3Btn.innerHTML;
            exportMp3Btn.innerHTML = "変換中...";
            exportMp3Btn.disabled = true;

            await new Promise(r => setTimeout(r, 50));

            try {
                const { l, r, length } = getTrimmedData();
                
                const int16L = floatToInt16(l);
                const int16R = floatToInt16(r);
                
                const mp3encoder = new lamejs.Mp3Encoder(2, sampleRate, 320); 
                const mp3Data = [];

                const sampleBlockSize = 1152 * 10; 
                for (let i = 0; i < length; i += sampleBlockSize) {
                    const chunkL = int16L.subarray(i, i + sampleBlockSize);
                    const chunkR = int16R.subarray(i, i + sampleBlockSize);
                    const mp3buf = mp3encoder.encodeBuffer(chunkL, chunkR);
                    if (mp3buf.length > 0) {
                        mp3Data.push(mp3buf);
                    }
                }
                
                const mp3bufFinal = mp3encoder.flush();
                if (mp3bufFinal.length > 0) {
                    mp3Data.push(mp3bufFinal);
                }

                const blob = new Blob(mp3Data, { type: 'audio/mpeg' });
                const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                
                await saveOrShare(blob, `OtoNoHime_${timestamp}.mp3`);
                
            } catch (err) {
                console.error("MP3 Encoding error:", err);
                showModal("申し訳ござらぬ", "MP3への変換に失敗いたしました。");
            } finally {
                exportMp3Btn.innerHTML = btnOriginalText;
                exportMp3Btn.disabled = false;
            }
        });
    </script>
