<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>M2 Recorder — High Quality Audio</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--line:#30363d;--text:#f0f3f6;--muted:#8b949e;--accent:#58a6ff;--red:#ff7b72;--green:#3fb950}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif}
body{overflow:hidden}
main{height:100dvh;max-width:1400px;margin:auto;padding:8px 12px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:8px}
h1{font-size:19px;margin:0;line-height:28px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin:0;min-width:0}
label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
select,button,input[type=range]{border-radius:8px;border:1px solid var(--line);background:#21262d;color:var(--text);font-size:14px}
select{height:36px;padding:0 8px;width:100%}
button{min-height:36px;padding:7px 12px;font-weight:650;cursor:pointer}
button.primary{background:var(--accent);color:#08111c;border-color:var(--accent)}
button.danger{background:#3d1618;border-color:#7d2527;color:#ffb4ad}
button:disabled{opacity:.45;cursor:not-allowed}
.buttons{display:flex;gap:7px;flex-wrap:wrap}
.buttons button{flex:0 1 auto;min-width:110px}
.status{color:var(--muted);font-size:11px;min-height:15px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meter{height:22px;background:#0b0e12;border:1px solid var(--line);border-radius:6px;overflow:hidden}.meter canvas{width:100%;height:100%;display:block}
.editor{display:flex;flex-direction:column;min-height:0}
.editor>label{flex:0 0 auto}
#wave{width:100%;height:min(34vh,190px);min-height:100px;background:#0b0e12;border-radius:8px;display:block;touch-action:none;flex:0 0 auto}
.trimrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:5px}
.trimrow>div>div{font-size:12px}
.value{text-align:right;color:var(--accent);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:32px;padding:0 6px;accent-color:var(--accent)}
.playbackInfo{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;margin-top:1px;font-variant-numeric:tabular-nums}
.gainbox{margin-top:5px}
.gainbox .info{margin-top:2px}
.info{font-size:10px;color:var(--muted);line-height:1.35}
.editor .buttons{margin-top:6px!important}
.export{display:flex;align-items:center;justify-content:space-between;gap:10px}
.export .info{flex:1}
@media(max-width:700px) and (orientation:portrait){
  body{overflow:auto}
  main{height:auto;min-height:100dvh;grid-template-rows:auto auto auto auto;padding:10px}
  .grid{grid-template-columns:1fr}
  #wave{height:180px}
  .buttons button{flex:1}
}
@media(orientation:landscape) and (min-width:700px) and (max-height:900px){
  main{grid-template-rows:auto auto minmax(0,1fr) auto}
  #wave{height:min(30vh,175px)}
}
</style></style>
</head>
<body>
<main>
<h1>🎙️ M2 Recorder</h1>

<div class="grid">
<section class="card">
<label>入力モード</label>
<select id="mode"><option value="mono">Ch1モノラル（Lを両耳に振る）</option><option value="stereo">ステレオ</option></select>
<label style="margin-top:12px">入力音量</label>
<div class="meter"><canvas id="meter"></canvas></div>
<div class="status" id="inputInfo">MOTU M2を接続して「録音開始」を押してください。</div>
</section>

<section class="card">
<label>録音</label>
<div class="buttons">
<button id="start" class="primary">● 録音開始</button>
<button id="stop" class="danger" disabled>■ 停止</button>
</div>
<div class="status" id="status">待機中</div>
</section>
</div>

<section class="card editor">
<label>波形・トリミング</label>
<canvas id="wave"></canvas>
<div class="trimrow">
<div><div>Start <span class="value" id="startVal">0.000 s</span></div><input id="startRange" type="range" min="0" max="0" step="0.001" value="0" disabled></div>
<div><div>End <span class="value" id="endVal">0.000 s</span></div><input id="endRange" type="range" min="0" max="0" step="0.001" value="0" disabled></div>
</div>
<div style="margin-top:12px">
  <div>ゲイン（波形に適用） <span class="value" id="gainVal">0.0 dB</span></div>
  <input id="gainRange" type="range" min="-24" max="12" step="0.1" value="0" disabled>
  <div class="playbackInfo"><span>-24 dB</span><span>0 dB</span><span>+12 dB</span></div>
  <div class="info" id="gainPreviewInfo">黄色＝ゲイン適用後の予想波形。ピークも表示します。</div>
</div>
<div class="buttons" style="margin-top:12px">
  <button id="applyGain" class="primary" disabled>✓ ゲインを適用</button>
  <button id="resetGain" disabled>↺ 0 dB</button>
</div>
<div class="buttons" style="margin-top:10px">
  <button id="undo" disabled>↶ アンドゥ</button>
  <button id="redo" disabled>↷ リドゥ</button>
</div>
<div class="buttons" style="margin-top:10px">
  <button id="play" class="primary" disabled>▶ 再生</button>
  <button id="pause" disabled>■ 停止</button>
</div>
<div class="buttons" style="margin-top:12px">
<button id="normalize" disabled>⟐ ノーマライズ（-0.3 dB）</button>
<button id="resetTrim" disabled>↺ 範囲リセット</button>
</div>
</section>

<section class="card export">
<label>エクスポート</label>
<div class="buttons">
<button id="wav" disabled>WAVで保存</button>
<button id="mp3" disabled>MP3で保存</button>
</div>
<div class="info" style="margin-top:10px">
録音データはこのページ内のメモリ上で処理します。MP3変換にはLameJSを使用します。
</div>
</section>
</main>

<script>
"use strict";
const $=id=>document.getElementById(id);
const meter=$("meter"), mctx=meter.getContext("2d"), wave=$("wave"), wctx=wave.getContext("2d");
let audioCtx, stream, source, analyser, raf, recording=false, chunks=[], recSampleRate=48000;
let buffer=null, trimStart=0, trimEnd=0, normalized=false;
let playbackCtx=null, playbackSource=null, playbackGain=null, playbackStartTime=0, playbackOffset=0, playbackRAF=0, isPlaying=false, currentPlayhead=0;
let editHistory=[], historyIndex=-1, pendingGainDb=0;

function fitCanvas(c,ctx){
  const dpr=Math.min(devicePixelRatio||1,2), r=c.getBoundingClientRect();
  c.width=Math.max(1,Math.floor(r.width*dpr)); c.height=Math.max(1,Math.floor(r.height*dpr));
  ctx.setTransform(dpr,0,0,dpr,0,0); return r;
}
function drawMeter(){
  if(!analyser)return;
  const r=fitCanvas(meter,mctx), data=new Uint8Array(analyser.fftSize);
  analyser.getByteTimeDomainData(data);
  let peak=0; for(const v of data) peak=Math.max(peak,Math.abs(v-128)/128);
  mctx.clearRect(0,0,r.width,r.height); mctx.fillStyle="#21262d";mctx.fillRect(0,0,r.width,r.height);
  mctx.fillStyle=peak>.95?"#ff7b72":"#3fb950";mctx.fillRect(0,0,r.width*Math.min(1,peak),r.height);
  raf=requestAnimationFrame(drawMeter);
}
function resize(){if(analyser)drawMeter(); if(buffer)drawWave();}
addEventListener("resize",resize);

$("mode").onchange=()=>{$("status").textContent="入力モードを変更しました。録音時に反映されます。";};

async function startRecording(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:{
      channelCount:$("mode").value==="stereo"?2:1,
      echoCancellation:false,noiseSuppression:false,autoGainControl:false
    }});
    audioCtx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:48000});
    await audioCtx.resume();
    recSampleRate=audioCtx.sampleRate;
    source=audioCtx.createMediaStreamSource(stream);
    analyser=audioCtx.createAnalyser();analyser.fftSize=2048;source.connect(analyser);drawMeter();
    chunks=[];
    const processor=audioCtx.createScriptProcessor(4096, $("mode").value==="stereo"?2:1, $("mode").value==="stereo"?2:1);
    source.connect(processor); processor.connect(audioCtx.destination);
    processor.onaudioprocess=e=>{
      if(!recording)return;
      const ch=e.inputBuffer.numberOfChannels;
      const frame=e.inputBuffer.length;
      const a=[];
      for(let c=0;c<ch;c++)a.push(new Float32Array(e.inputBuffer.getChannelData(c)));
      chunks.push(a);
    };
    window.processor=processor; recording=true;
    $("start").disabled=true;$("stop").disabled=false;$("status").textContent=`録音中… ${recSampleRate/1000} kHz`;
    $("inputInfo").textContent=`入力 ${stream.getAudioTracks()[0].label||"MOTU M2"} / ${$("mode").value==="stereo"?"ステレオ":"モノ"} / ${recSampleRate} Hz`;
  }catch(e){$("status").textContent="マイク入力を開始できません: "+e.message;}
}
function stopRecording(){
  recording=false; if(window.processor){window.processor.disconnect();window.processor.onaudioprocess=null}
  if(source)source.disconnect(); if(analyser)analyser.disconnect(); if(stream)stream.getTracks().forEach(t=>t.stop());
  cancelAnimationFrame(raf);
  if(!chunks.length){$("status").textContent="録音データがありません。";return}
  const ch=chunks[0].length, frames=chunks.reduce((n,a)=>n+a[0].length,0);
  buffer=audioCtx.createBuffer(ch,frames,recSampleRate);
  let off=0; for(const a of chunks){for(let c=0;c<ch;c++)buffer.getChannelData(c).set(a[c],off);off+=a[0].length}
  trimStart=0;trimEnd=buffer.duration;normalized=false;currentPlayhead=0;
editHistory=[cloneAudioBuffer(buffer)];historyIndex=0;pendingGainDb=0;
updateEditor();
  $("start").disabled=false;$("stop").disabled=true;$("status").textContent=`録音完了　${buffer.duration.toFixed(3)} 秒`;
}
$("start").onclick=startRecording;$("stop").onclick=stopRecording;


function stopPlayback(){
  if(playbackSource){
    try{playbackSource.stop()}catch(e){}
    try{playbackSource.disconnect()}catch(e){}
    playbackSource=null;
  }
  cancelAnimationFrame(playbackRAF);
  isPlaying=false;
  currentPlayhead=trimStart;
  $("play").textContent="▶ 再生";
  $("pause").disabled=true;
  drawWave();
}
async function startPlayback(){
  if(!buffer)return;
  stopPlayback();
  playbackCtx=playbackCtx || new (window.AudioContext||window.webkitAudioContext)();
  try{await playbackCtx.resume();}catch(e){$("status").textContent="再生用オーディオを開始できません: "+e.message;return;}
  playbackGain=playbackGain || playbackCtx.createGain();
  playbackGain.gain.value=Number($("gainRange").value)/100;
  playbackGain.connect(playbackCtx.destination);

  const src=playbackCtx.createBufferSource();
  src.buffer=buffer; src.connect(playbackGain);
  playbackSource=src;
  const now=playbackCtx.currentTime;
  const offset=Math.max(trimStart, Math.min(currentPlayhead || trimStart, trimEnd));
  const duration=Math.max(0.001,trimEnd-offset);
  playbackStartTime=now-offset;
  playbackOffset=offset;
  isPlaying=true;
  $("play").textContent="▶ 再生中";
  $("pause").disabled=false;
  src.onended=()=>{ if(playbackSource===src){isPlaying=false;playbackSource=null;cancelAnimationFrame(playbackRAF);currentPlayhead=trimEnd;$("play").textContent="▶ 再生";$("pause").disabled=true;drawWave();} };
  src.onstart=null;
  src.start(0,offset,duration);
  $("status").textContent=`再生中　${offset.toFixed(3)}–${trimEnd.toFixed(3)} 秒　ゲイン ${((Number($("gainRange").value)||0)).toFixed(1)} dB`;
  animatePlayhead();
}
function animatePlayhead(){
  if(!isPlaying||!playbackCtx)return;
  currentPlayhead=playbackCtx.currentTime-playbackStartTime;
  if(currentPlayhead>trimEnd)currentPlayhead=trimEnd;
  drawWave();
  playbackRAF=requestAnimationFrame(animatePlayhead);
}
$("play").onclick=startPlayback;
$("pause").onclick=stopPlayback;
$("gainRange").oninput=e=>{
  const g=Number(e.target.value);
  $("gainVal").textContent=g+"%";
  if(playbackGain)playbackGain.gain.setValueAtTime(g/100,playbackCtx.currentTime);
};
window.addEventListener("beforeunload",stopPlayback);


function cloneAudioBuffer(src){
  const b=new AudioBuffer({length:src.length,numberOfChannels:src.numberOfChannels,sampleRate:src.sampleRate});
  for(let c=0;c<src.numberOfChannels;c++) b.getChannelData(c).set(src.getChannelData(c));
  return b;
}
function pushHistorySnapshot(snapshot){
  editHistory=editHistory.slice(0,historyIndex+1);
  editHistory.push(cloneAudioBuffer(snapshot));
  if(editHistory.length>30)editHistory.shift();
  historyIndex=editHistory.length-1;
  updateHistoryButtons();
}
function restoreHistory(index){
  if(index<0||index>=editHistory.length)return;
  stopPlayback();
  buffer=cloneAudioBuffer(editHistory[index]);
  historyIndex=index;
  pendingGainDb=0;
  $("gainRange").value=0;
  $("gainVal").textContent="0.0 dB";
  $("gainPreviewInfo").textContent="履歴から復元しました。";
  trimEnd=Math.min(trimEnd,buffer.duration);
  trimStart=Math.min(trimStart,Math.max(0,trimEnd-0.001));
  updateEditor();
}
function updateHistoryButtons(){
  $("undo").disabled=!buffer||historyIndex<=0;
  $("redo").disabled=!buffer||historyIndex>=editHistory.length-1;
}
function dbToGain(db){return Math.pow(10,db/20)}
function getPeak(buf){
  let peak=0;
  for(let c=0;c<buf.numberOfChannels;c++){
    const d=buf.getChannelData(c);
    for(let i=0;i<d.length;i++) peak=Math.max(peak,Math.abs(d[i]));
  }
  return peak;
}
$("gainRange").oninput=e=>{
  pendingGainDb=Number(e.target.value);
  $("gainVal").textContent=(pendingGainDb>=0?"+":"")+pendingGainDb.toFixed(1)+" dB";
  if(!buffer)return;
  const peak=getPeak(buffer), predicted=peak*dbToGain(pendingGainDb);
  const db=predicted>0?20*Math.log10(predicted):-Infinity;
  $("gainPreviewInfo").textContent=
    `適用後の予想ピーク: ${db===-Infinity?"−∞":(db>=0?"+":"")+db.toFixed(1)} dBFS`+
    (predicted>1?"　⚠ 0 dBFSを超えます（クリップ注意）":"");
  drawWave();
};
$("resetGain").onclick=()=>{
  pendingGainDb=0;$("gainRange").value=0;$("gainVal").textContent="0.0 dB";
  $("gainPreviewInfo").textContent="ゲイン変更はまだ適用されていません。";
  drawWave();
};
$("applyGain").onclick=()=>{
  if(!buffer||Math.abs(pendingGainDb)<0.0001)return;
  stopPlayback();
  const before=cloneAudioBuffer(buffer);
  const g=dbToGain(pendingGainDb);
  for(let c=0;c<buffer.numberOfChannels;c++){
    const d=buffer.getChannelData(c);
    for(let i=0;i<d.length;i++) d[i]*=g;
  }
  pushHistorySnapshot(before);
  editHistory.push(cloneAudioBuffer(buffer));
  historyIndex=editHistory.length-1;
  updateHistoryButtons();
  $("status").textContent=`ゲイン ${pendingGainDb>=0?"+":""}${pendingGainDb.toFixed(1)} dB を波形に適用しました。`;
  pendingGainDb=0;$("gainRange").value=0;$("gainVal").textContent="0.0 dB";
  $("gainPreviewInfo").textContent="適用完了。";
  updateEditor();
};
$("undo").onclick=()=>{
  if(historyIndex<=0)return;
  restoreHistory(historyIndex-1);
  $("status").textContent="アンドゥしました。";
};
$("redo").onclick=()=>{
  if(historyIndex>=editHistory.length-1)return;
  restoreHistory(historyIndex+1);
  $("status").textContent="リドゥしました。";
};

function updateEditor(){
  $("startRange").disabled=$("endRange").disabled=$("normalize").disabled=$("resetTrim").disabled=$("wav").disabled=$("mp3").disabled=$("gainRange").disabled=$("applyGain").disabled=$("resetGain").disabled=$("play").disabled=!buffer;
$("pause").disabled=!isPlaying;
updateHistoryButtons();
  if(!buffer)return;
  $("startRange").max=buffer.duration;$("endRange").max=buffer.duration;
  $("startRange").value=trimStart;$("endRange").value=trimEnd;
  $("startVal").textContent=trimStart.toFixed(3)+" s";$("endVal").textContent=trimEnd.toFixed(3)+" s";
  if(currentPlayhead<trimStart||currentPlayhead>trimEnd) currentPlayhead=trimStart;
  drawWave();
}
function drawWave(){
  const r=fitCanvas(wave,wctx);wctx.clearRect(0,0,r.width,r.height);
  wctx.fillStyle="#0b0e12";wctx.fillRect(0,0,r.width,r.height);
  if(!buffer)return;
  const data=buffer.getChannelData(0), mid=r.height/2, amp=r.height*.42, step=Math.max(1,Math.floor(data.length/r.width));

  // 元波形
  wctx.beginPath();wctx.strokeStyle="#58a6ff";wctx.lineWidth=1;
  for(let x=0;x<r.width;x++){
    let ss=x*step,e=Math.min(data.length,ss+step),mn=1,mx=-1;
    for(let i=ss;i<e;i+=4){let v=data[i];if(v<mn)mn=v;if(v>mx)mx=v}
    wctx.moveTo(x,mid+mn*amp);wctx.lineTo(x,mid+mx*amp);
  }
  wctx.stroke();

  // ゲイン適用後の予想波形
  if(Math.abs(pendingGainDb)>0.0001){
    const g=dbToGain(pendingGainDb);
    wctx.beginPath();wctx.strokeStyle="#f2cc60";wctx.lineWidth=2;
    for(let x=0;x<r.width;x++){
      let ss=x*step,e=Math.min(data.length,ss+step),mn=1,mx=-1;
      for(let i=ss;i<e;i+=4){
        let v=Math.max(-1,Math.min(1,data[i]*g));
        if(v<mn)mn=v;if(v>mx)mx=v;
      }
      wctx.moveTo(x,mid+mn*amp);wctx.lineTo(x,mid+mx*amp);
    }
    wctx.stroke();
  }

  const sx=trimStart/buffer.duration*r.width, ex=trimEnd/buffer.duration*r.width;
  wctx.fillStyle="rgba(255,123,114,.18)";wctx.fillRect(0,0,sx,r.height);wctx.fillRect(ex,0,r.width-ex,r.height);
  wctx.fillStyle="#ff7b72";wctx.fillRect(sx,0,2,r.height);wctx.fillRect(ex-2,0,2,r.height);

  // 再生位置
  const ph=Math.max(0,Math.min(buffer.duration,currentPlayhead));
  const px=ph/buffer.duration*r.width;
  wctx.fillStyle="#ffffff";wctx.fillRect(Math.round(px)-1,0,3,r.height);
  wctx.beginPath();wctx.arc(px,12,6,0,Math.PI*2);wctx.fill();
  wctx.font="12px -apple-system,BlinkMacSystemFont,sans-serif";
  wctx.fillText(ph.toFixed(3)+" s",Math.min(Math.max(px+8,8),r.width-58),32);

  if(Math.abs(pendingGainDb)>0.0001){
    wctx.fillStyle="#f2cc60";
    wctx.fillText(`PREVIEW ${pendingGainDb>=0?"+":""}${pendingGainDb.toFixed(1)} dB`,8,r.height-10);
  }
}
function setTrim(which,v){
  stopPlayback();
  v=Math.max(0,Math.min(buffer.duration,Number(v)));
  if(which==="start")trimStart=Math.min(v,trimEnd-0.001);
  else trimEnd=Math.max(v,trimStart+0.001);
  updateEditor();
}
$("startRange").oninput=e=>setTrim("start",e.target.value);
$("endRange").oninput=e=>setTrim("end",e.target.value);
$("resetTrim").onclick=()=>{stopPlayback();trimStart=0;trimEnd=buffer.duration;currentPlayhead=0;updateEditor()};

let dragHandle=null;
wave.addEventListener("pointerdown",e=>{
  if(!buffer)return;wave.setPointerCapture(e.pointerId);
  const r=wave.getBoundingClientRect(),t=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*buffer.duration;
  const ds=Math.abs(t-trimStart),de=Math.abs(t-trimEnd);
  dragHandle=ds<de?"start":"end"; setTrim(dragHandle,t);
});
wave.addEventListener("pointermove",e=>{
  if(!buffer||!wave.hasPointerCapture(e.pointerId))return;
  const r=wave.getBoundingClientRect(),t=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*buffer.duration;
  setTrim(dragHandle,t);
});
wave.addEventListener("pointerup",e=>{dragHandle=null;});

$("normalize").onclick=()=>{
  if(!buffer)return;
  stopPlayback();const before=cloneAudioBuffer(buffer);let peak=0;
  for(let c=0;c<buffer.numberOfChannels;c++){const d=buffer.getChannelData(c);for(let i=0;i<d.length;i++)peak=Math.max(peak,Math.abs(d[i]))}
  if(!peak)return;const gain=Math.pow(10,-.3/20)/peak;
  for(let c=0;c<buffer.numberOfChannels;c++){const d=buffer.getChannelData(c);for(let i=0;i<d.length;i++)d[i]*=gain}
  normalized=true;
  pushHistorySnapshot(before);
  editHistory.push(cloneAudioBuffer(buffer));historyIndex=editHistory.length-1;updateHistoryButtons();
  drawWave();$("status").textContent="ノーマライズ完了（ピーク -0.3 dBFS）";
};

function trimmed(){
  const s=Math.floor(trimStart*buffer.sampleRate), e=Math.floor(trimEnd*buffer.sampleRate), n=Math.max(1,e-s);
  const b=new AudioBuffer({length:n,numberOfChannels:buffer.numberOfChannels,sampleRate:buffer.sampleRate});
  for(let c=0;c<b.numberOfChannels;c++)b.getChannelData(c).set(buffer.getChannelData(c).subarray(s,e));
  return b;
}
function wavBlob(b){
  const ch=b.numberOfChannels, sr=b.sampleRate, frames=b.length, bytes=frames*ch*2, ab=new ArrayBuffer(44+bytes),v=new DataView(ab);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  ws(0,"RIFF");v.setUint32(4,36+bytes,true);ws(8,"WAVE");ws(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);ws(36,"data");v.setUint32(40,bytes,true);
  let o=44;for(let i=0;i<frames;i++)for(let c=0;c<ch;c++){let x=Math.max(-1,Math.min(1,b.getChannelData(c)[i]));v.setInt16(o,x<0?x*32768:x*32767,true);o+=2}
  return new Blob([ab],{type:"audio/wav"});
}
function saveBlob(blob,name){
  const a=document.createElement("a"),u=URL.createObjectURL(blob);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);
}
$("wav").onclick=()=>{stopPlayback();const b=trimmed();saveBlob(wavBlob(b),"recording.wav");$("status").textContent="WAVを生成しました。Safariのダウンロードから「ファイルに保存」できます。"};
$("mp3").onclick=async()=>{
  stopPlayback();
  if(!window.lamejs){$("status").textContent="MP3エンコーダーを読み込めませんでした。ネット接続を確認してください。";return}
  const b=trimmed(), sr=b.sampleRate, enc=new lamejs.Mp3Encoder(b.numberOfChannels,sr,192), block=1152, parts=[];
  const ds=[];for(let c=0;c<b.numberOfChannels;c++){const f=b.getChannelData(c),a=new Int16Array(f.length);for(let i=0;i<f.length;i++)a[i]=Math.max(-32768,Math.min(32767,f[i]*32767));ds.push(a)}
  for(let i=0;i<b.length;i+=block){let left=ds[0].subarray(i,Math.min(i+block,b.length)),mp3;if(b.numberOfChannels===1)mp3=enc.encodeBuffer(left);else mp3=enc.encodeBuffer(left,ds[1].subarray(i,Math.min(i+block,b.length)));if(mp3.length)parts.push(mp3)}
  const end=enc.flush();if(end.length)parts.push(end);saveBlob(new Blob(parts,{type:"audio/mpeg"}),"recording.mp3");$("status").textContent="MP3を生成しました。";
};
